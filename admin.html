<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>

<style>
body {
    font-family: Arial;
    background: #fdfbf7;
    padding: 20px;
}

h1 {
    color: #0b3c5d;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 15px;
    max-width: 500px;
    margin: auto;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
}

button {
    background: #0b3c5d;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    cursor: pointer;
}

.producto {
    background: #fff;
    padding: 10px;
    margin-top: 10px;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>Panel Admin 💻</h1>

<div class="panel">

    <h3>Agregar producto</h3>

    <input id="nombre" placeholder="Nombre (Ej: Rosa G)">
    <input id="precio" type="number" placeholder="Precio">
    <input id="img" placeholder="Link de imagen">

    <select id="categoria">
        <option value="pequeñas">Pequeñas</option>
        <option value="medianas">Medianas</option>
        <option value="grandes">Grandes</option>
    </select>

    <button onclick="agregar()">Agregar</button>

    <h3>Productos cargados</h3>
    <div id="lista"></div>

</div>

<script>

let productos = JSON.parse(localStorage.getItem("productos")) || [];

function guardar(){
    localStorage.setItem("productos", JSON.stringify(productos));
}

function mostrar(){
    let lista = document.getElementById("lista");
    lista.innerHTML = "";

    productos.forEach((p,i)=>{
        lista.innerHTML += `
        <div class="producto">
            <b>${p.nombre}</b> - $${p.precio}<br>
            ${p.categoria}
            <button onclick="eliminar(${i})">Eliminar</button>
        </div>
        `;
    });
}

function agregar(){
    let nombre = document.getElementById("nombre").value;
    let precio = document.getElementById("precio").value;
    let img = document.getElementById("img").value;
    let categoria = document.getElementById("categoria").value;

    if(!nombre || !precio){
        alert("Completa los datos");
        return;
    }

    productos.push({nombre, precio, img, categoria});
    guardar();
    mostrar();

    document.getElementById("nombre").value = "";
    document.getElementById("precio").value = "";
    document.getElementById("img").value = "";
}

function eliminar(i){
    productos.splice(i,1);
    guardar();
    mostrar();
}

mostrar();

</script>

</body>
</html>
