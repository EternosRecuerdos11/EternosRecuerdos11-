<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        .flower {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            margin: 10px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .flower img {
            max-width: 100%;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Our Flower Shop</h1>

    <div id="flower-container">
        <h2>Our Flowers</h2>
        <div class="flower">
            <h3>Roses</h3>
            <img src="https://example.com/roses.jpg" alt="Roses">
            <p>Size: Medium</p>
            <p>Price: $20</p>
            <label for="roses-quantity">Quantity:</label>
            <input id="roses-quantity" type="number" value="1" min="1">
            <button onclick="order('Roses', document.getElementById('roses-quantity').value, 20)">Order</button>
        </div>
        <div class="flower">
            <h3>Tulips</h3>
            <img src="https://example.com/tulips.jpg" alt="Tulips">
            <p>Size: Small</p>
            <p>Price: $15</p>
            <label for="tulips-quantity">Quantity:</label>
            <input id="tulips-quantity" type="number" value="1" min="1">
            <button onclick="order('Tulips', document.getElementById('tulips-quantity').value, 15)">Order</button>
        </div>
        <!-- You can add more flowers in a similar way -->
    </div>

    <script>
        function order(flowerType, quantity, price) {
            // Simplistic order handling, replace with actual DM functionality
            const total = quantity * price;
            const message = `Order: ${flowerType}, Quantity: ${quantity}, Total: $${total}`;
            alert("Sending message to Instagram DM\n" + message);
        }
    </script>
</body>
</html>
