<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recuerdos Eternos</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
    <h1>Recuerdos Eternos ✨</h1>
</header>

<input type="text" id="buscar" placeholder="Buscar...">

<div id="productos"></div>

<div class="carrito">
    <h3>Carrito</h3>
    <div id="lista"></div>
    <p>Total: $<span id="total">0</span></p>
    <button onclick="enviar()">Finalizar</button>
</div>

<script>
let productos = JSON.parse(localStorage.getItem("productos")) || [];
let carrito = [];

function mostrar(){
    let cont = document.getElementById("productos");
    cont.innerHTML = "";

    productos.forEach((p,i)=>{
        cont.innerHTML += `
        <div class="card">
            <img src="${p.img}">
            <h3>${p.nombre}</h3>
            <p>$${p.precio}</p>

            <select onchange="agregar(${i}, this.value)">
                <option value="">Elegir papel</option>
                <option value="Común">Común</option>
                <option value="Coreano">Coreano</option>
            </select>

        </div>`;
    });
}

function agregar(i, papel){
    let p = productos[i];
    carrito.push({...p, papel});
    actualizar();
}

function actualizar(){
    let lista = document.getElementById("lista");
    let total = 0;
    lista.innerHTML = "";

    carrito.forEach(p=>{
        total += p.precio;
        lista.innerHTML += `<p>${p.nombre} (${p.papel})</p>`;
    });

    document.getElementById("total").innerText = total;
}

function enviar(){
    let texto = "Pedido:%0A";
    carrito.forEach(p=>{
        texto += `${p.nombre} (${p.papel}) - $${p.precio}%0A`;
    });

    window.open(`https://wa.me/549XXXXXXXXXX?text=${texto}`);
}

mostrar();
</script>

</body>
</html>
