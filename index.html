<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuerdos Eternos</title>
<link rel="stylesheet" href="estilos.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">Recuerdos Eternos ✨</div>

    <div class="acciones">
        <input type="text" id="buscador" placeholder="Buscar flores...">
        
        <div class="carrito-icono" onclick="toggleCarrito()">
            🛒 <span id="contador">0</span>
        </div>
    </div>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hero-texto">
        <h1>Diseñá tu ramo ideal 💙</h1>
        <p>Elegí flores, combinaciones y envoltorios</p>
    </div>

    <div class="hero-media">
        <!-- VIDEO O IMAGEN -->
        <video autoplay muted loop>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>
</section>

<!-- CATEGORÍAS -->
<section class="categorias">
    <button onclick="filtrar('todas')">Todas</button>
    <button onclick="filtrar('pequeñas')">Pequeñas</button>
    <button onclick="filtrar('medianas')">Medianas</button>
    <button onclick="filtrar('grandes')">Grandes</button>
</section>

<!-- PRODUCTOS -->
<section id="productos" class="productos"></section>

<!-- CARRITO -->
<div id="carrito" class="carrito oculto">

    <h2>Tu ramo 🌸</h2>

    <div id="lista"></div>

    <div class="opciones">
        <h4>Envoltorio</h4>
        <select id="envoltorio">
            <option value="0">Común ($0)</option>
            <option value="7000">Coreano ($7000)</option>
        </select>
    </div>

    <div class="total">
        <p>Total: $<span id="total">0</span></p>
    </div>

    <button class="btn-finalizar" onclick="enviarPedido()">Finalizar pedido</button>
</div>

<!-- INFO -->
<section class="info">
    <h2>¿Cómo comprar?</h2>
    <p>✔ Elegí tus flores</p>
    <p>✔ Personalizá tu ramo</p>
    <p>✔ Enviamos o retiro en domicilio</p>
</section>

<script>

let productos = JSON.parse(localStorage.getItem("productos")) || [
    {nombre:"Hortensia P", precio:1000, categoria:"pequeñas"},
    {nombre:"Nube P", precio:1500, categoria:"pequeñas"},
    {nombre:"Campanita P", precio:1300, categoria:"pequeñas"},
    {nombre:"Lavanda P", precio:1500, categoria:"pequeñas"},
    {nombre:"Margarita P", precio:2100, categoria:"pequeñas"},

    {nombre:"Margarita M", precio:4100, categoria:"medianas"},
    {nombre:"Campanilla M", precio:4400, categoria:"medianas"},
    {nombre:"Lavanda M", precio:4200, categoria:"medianas"},
    {nombre:"Camelia M", precio:5500, categoria:"medianas"},
    {nombre:"Tulipán M", precio:6000, categoria:"medianas"},

    {nombre:"Lavanda G", precio:5800, categoria:"grandes"},
    {nombre:"Dahlia G", precio:6000, categoria:"grandes"},
    {nombre:"Gerbera G", precio:6100, categoria:"grandes"},
    {nombre:"Tulipán G", precio:7000, categoria:"grandes"},
    {nombre:"Hibisco G", precio:6500, categoria:"grandes"},
    {nombre:"Amapola G", precio:7500, categoria:"grandes"},
    {nombre:"Lirio 5 pétalos", precio:8000, categoria:"grandes"},
    {nombre:"Lirio 6 pétalos", precio:8700, categoria:"grandes"},
    {nombre:"Crisantemo G", precio:8600, categoria:"grandes"},
    {nombre:"Girasol G", precio:9500, categoria:"grandes"},
    {nombre:"Margarita G", precio:9200, categoria:"grandes"},
    {nombre:"Rosa G", precio:9000, categoria:"grandes"},
    {nombre:"Flor de Loto", precio:9500, categoria:"grandes"},
    {nombre:"Lirio Araña", precio:9000, categoria:"grandes"},
    {nombre:"Peonia G", precio:10500, categoria:"grandes"}
];

let carrito = [];

function render(lista){
    let cont = document.getElementById("productos");
    cont.innerHTML = "";

    lista.forEach((p,i)=>{
        cont.innerHTML += `
        <div class="card">
            <div class="img"></div>

            <h3>${p.nombre}</h3>
            <p>$${p.precio}</p>

            <button onclick="agregar(${i})">Agregar</button>
        </div>`;
    });
}

function filtrar(cat){
    if(cat === "todas"){
        render(productos);
    } else {
        let filtrados = productos.filter(p=>p.categoria === cat);
        render(filtrados);
    }
}

function agregar(i){
    carrito.push(productos[i]);
    actualizar();
}

function actualizar(){
    let lista = document.getElementById("lista");
    let total = 0;

    lista.innerHTML = "";

    carrito.forEach(p=>{
        total += p.precio;
        lista.innerHTML += `<p>${p.nombre} - $${p.precio}</p>`;
    });

    document.getElementById("total").innerText = total;
    document.getElementById("contador").innerText = carrito.length;
}

function toggleCarrito(){
    document.getElementById("carrito").classList.toggle("oculto");
}

function enviarPedido(){
    let envoltorio = parseInt(document.getElementById("envoltorio").value);
    let total = parseInt(document.getElementById("total").innerText) + envoltorio;

    let msg = "Hola! Quiero este ramo:%0A";

    carrito.forEach(p=>{
        msg += `${p.nombre} - $${p.precio}%0A`;
    });

    msg += `%0AEnvoltorio: $${envoltorio}`;
    msg += `%0ATotal: $${total}`;

    window.open(`https://wa.me/5492942338718?text=${msg}`);
}

document.getElementById("buscador").addEventListener("input", function(){
    let texto = this.value.toLowerCase();
    let filtrados = productos.filter(p => p.nombre.toLowerCase().includes(texto));
    render(filtrados);
});

render(productos);

</script>

</body>
</html>
