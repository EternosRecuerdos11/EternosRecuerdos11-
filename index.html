<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eternos Recuerdos 11</title>

<style>
body{
margin:0;
font-family:'Segoe UI', sans-serif;
background:#f5efe6;
}

header{
background:#1e3a8a;
padding:20px;
text-align:center;
color:gold;
position:sticky;
top:0;
}

.cart-icon{
position:absolute;
right:20px;
top:20px;
cursor:pointer;
}

.admin-btn{
position:absolute;
left:20px;
top:20px;
cursor:pointer;
}

.menu{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:30px;
}

.menu-card{
width:180px;
background:white;
border-radius:10px;
text-align:center;
cursor:pointer;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.menu-card img{
width:100%;
height:120px;
object-fit:cover;
}

.section{
display:none;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:15px;
}

.card{
background:white;
padding:10px;
border-radius:10px;
text-align:center;
}

.btn{
padding:8px;
margin-top:5px;
border:none;
border-radius:5px;
cursor:pointer;
}

.whatsapp{background:#25D366;color:white;}
.insta{background:#E1306C;color:white;}

.color{
width:25px;
height:25px;
border-radius:50%;
cursor:pointer;
display:inline-block;
margin:5px;
}

</style>
</head>

<body>

<header>
<button class="admin-btn" onclick="abrir('admin')">⚙</button>
<h1>Eternos Recuerdos 11</h1>
<div class="cart-icon" onclick="abrir('carrito')">🛒 <span id="count">0</span></div>

<a href="https://www.instagram.com/eternos_recuerdos11" target="_blank">
<button class="btn insta">Instagram</button>
</a>

</header>

<!-- INICIO -->
<div id="inicio">
<div class="menu">

<div class="menu-card" onclick="abrir('disenar')">
<img src="https://images.unsplash.com/photo-1525310072745-f49212b5ac6d">
<p>Diseñar ramo</p>
</div>

<div class="menu-card" onclick="abrir('hechos')">
<img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946">
<p>Ramos hechos</p>
</div>

</div>
</div>

<!-- DISEÑADOR -->
<div id="disenar" class="section">
<button onclick="volver()">← Volver</button>

<h2>Diseñá tu ramo</h2>

<div id="colores"></div>

<div class="grid" id="flores"></div>

<select id="envoltorio">
<option>Blanco</option>
<option>Negro</option>
<option>Rosa</option>
<option>Azul</option>
</select>

<button id="addBtn" class="btn" onclick="agregar()">Agregar</button>

</div>

<!-- CARRITO -->
<div id="carrito" class="section">
<button onclick="volver()">← Volver</button>

<h2>Carrito</h2>
<div id="lista"></div>

<input id="nombre" placeholder="Nombre"><br>
<input id="contacto" placeholder="Contacto"><br>

<button class="btn whatsapp" onclick="pedido()">Enviar pedido</button>

</div>

<!-- TIENDA -->
<div id="hechos" class="section">
<button onclick="volver()">← Volver</button>
<div id="productos" class="grid"></div>
</div>

<!-- ADMIN -->
<div id="admin" class="section">
<button onclick="volver()">← Volver</button>

<input id="n" placeholder="Nombre">
<input id="i" placeholder="Imagen URL">

<button onclick="addProd()">Agregar</button>

<div id="adminList"></div>

</div>

<script>

/* NAV */
function abrir(id){
document.getElementById("inicio").style.display="none";
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
document.getElementById(id).style.display="block";
}

function volver(){
document.getElementById("inicio").style.display="block";
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
}

/* DATOS */
let colores=["red","pink","blue","yellow","green","black","white","gold"];
let flores=["Rosa","Tulipán","Girasol"];
let carrito=[];
let productos=JSON.parse(localStorage.getItem("p"))||[];

/* CREAR COLORES */
colores.forEach(c=>{
let d=document.createElement("div");
d.className="color";
d.style.background=c;
d.onclick=()=>{
document.querySelectorAll(".color").forEach(x=>x.style.border="none");
d.style.border="2px solid black";
window.color=c;
};
coloresDiv.appendChild(d);
});

/* FLORES */
flores.forEach(f=>{
let card=document.createElement("div");
card.className="card";
card.innerHTML=`${f}<br><button onclick="sel('${f}')">Elegir</button>`;
floresDiv.appendChild(card);
});

function sel(f){window.flor=f}

/* AGREGAR */
function agregar(){
if(!color||!flor){alert("Elegí");return;}

carrito.push({flor,color,cant:1,precio:5000});
renderCarrito();

let b=document.getElementById("addBtn");
b.innerText="✔";
setTimeout(()=>b.innerText="Agregar",1000);
}

/* CARRITO */
function renderCarrito(){
let l=document.getElementById("lista");
l.innerHTML="";
let total=0;

carrito.forEach((p,i)=>{
total+=p.precio*p.cant;

l.innerHTML+=`
<div>
${p.flor} ${p.color} $${p.precio}
<br>
<button onclick="p.cant++;renderCarrito()">+</button>
${p.cant}
<button onclick="p.cant--;renderCarrito()">-</button>
<button onclick="carrito.splice(${i},1);renderCarrito()">X</button>
</div>
`;
});

l.innerHTML+=`<h3>Total: $${total}</h3>`;
document.getElementById("count").innerText=carrito.length;
}

/* PEDIDO */
function pedido(){
let t="Pedido:\n";
carrito.forEach(p=>{
t+=`${p.flor} x${p.cant}\n`;
});
window.open("https://wa.me/5492942338718?text="+encodeURIComponent(t));
}

/* ADMIN */
function addProd(){
let n=document.getElementById("n").value;
let i=document.getElementById("i").value;

productos.push({n,i});
localStorage.setItem("p",JSON.stringify(productos));
renderProd();
renderAdmin();
}

function renderProd(){
let d=document.getElementById("productos");
d.innerHTML="";
productos.forEach(p=>{
d.innerHTML+=`
<div class="card">
<img src="${p.i}" width="100%">
${p.n}
<button onclick="carrito.push({flor:'${p.n}',cant:1,precio:6000});renderCarrito()">Agregar</button>
</div>
`;
});
}

function renderAdmin(){
let d=document.getElementById("adminList");
d.innerHTML="";
productos.forEach((p,i)=>{
d.innerHTML+=`
<div>
${p.n}
<button onclick="productos.splice(${i},1);localStorage.setItem('p',JSON.stringify(productos));renderAdmin();renderProd()">Eliminar</button>
</div>
`;
});
}

renderProd();
renderAdmin();

</script>

</body>
</html>
