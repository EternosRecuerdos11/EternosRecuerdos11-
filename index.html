<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eternos Recuerdos 11</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5efe6;
}

/* HEADER */
header{
background:#1e3a8a;
color:gold;
padding:15px;
text-align:center;
position:sticky;
top:0;
}

header button{
position:absolute;
top:15px;
border:none;
padding:5px 10px;
cursor:pointer;
}

#adminBtn{left:10px;}
#cartBtn{right:10px;}

/* GENERAL */
.section{display:none;padding:20px;}
.menu{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;}
.card{
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
}

/* COLORES */
.color{
width:30px;
height:30px;
border-radius:50%;
display:inline-block;
margin:5px;
cursor:pointer;
}

/* BOTONES */
.btn{
margin-top:5px;
padding:6px;
border:none;
cursor:pointer;
border-radius:5px;
}

.whatsapp{background:#25D366;color:white;}
</style>

</head>

<body>

<header>
<button id="adminBtn" onclick="openSection('admin')">⚙</button>
<h1>Eternos Recuerdos 11</h1>
<button id="cartBtn" onclick="openSection('cart')">🛒 <span id="count">0</span></button>
</header>

<!-- INICIO -->
<div id="home">
<div class="menu">

<div class="card" onclick="openSection('designer')">Diseñar ramo</div>
<div class="card" onclick="openSection('shop')">Ramos hechos</div>

</div>
</div>

<!-- DISEÑADOR -->
<div id="designer" class="section">
<button onclick="goHome()">←</button>

<h2>Diseñá tu ramo</h2>

<div id="colors"></div>
<div id="flowers" class="grid"></div>

<select id="wrap">
<option>Blanco</option>
<option>Negro</option>
<option>Rosa</option>
<option>Azul</option>
<option>Dorado</option>
</select>

<br><br>
<button class="btn" onclick="addCustom()">Agregar</button>

</div>

<!-- CARRITO -->
<div id="cart" class="section">
<button onclick="goHome()">←</button>

<h2>Carrito</h2>
<div id="cartList"></div>

<input id="name" placeholder="Nombre"><br>
<input id="contact" placeholder="Contacto"><br>

<button class="btn whatsapp" onclick="send()">Enviar pedido</button>
</div>

<!-- TIENDA -->
<div id="shop" class="section">
<button onclick="goHome()">←</button>
<div id="products" class="grid"></div>
</div>

<!-- ADMIN -->
<div id="admin" class="section">
<button onclick="goHome()">←</button>

<h2>Admin</h2>

<input id="pname" placeholder="Nombre"><br>
<input id="pimg" placeholder="Imagen URL"><br>
<input id="pprice" placeholder="Precio"><br>

<button onclick="addProduct()">Agregar</button>

<h3>Lista</h3>
<div id="adminList"></div>

</div>

<script>

/* NAV */
function openSection(id){
document.getElementById("home").style.display="none";
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
document.getElementById(id).style.display="block";
}

function goHome(){
document.getElementById("home").style.display="block";
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
}

/* DATOS */
let carrito=[];
let productos=JSON.parse(localStorage.getItem("productos"))||[];

/* COLORES */
let colorSel=null;
let flowerSel=null;

let colorList=["red","pink","blue","yellow","green","black","white","gold"];

colorList.forEach(c=>{
let d=document.createElement("div");
d.className="color";
d.style.background=c;

d.onclick=()=>{
document.querySelectorAll(".color").forEach(x=>x.style.border="none");
d.style.border="3px solid black";
colorSel=c;
};

colors.appendChild(d);
});

/* FLORES */
let flowersData=["Rosa","Tulipán","Girasol","Lirio"];

flowersData.forEach(f=>{
let div=document.createElement("div");
div.className="card";

div.innerHTML=`${f}<br><button onclick="selectFlower('${f}')">Elegir</button>`;
flowers.appendChild(div);
});

function selectFlower(f){
flowerSel=f;
}

/* AGREGAR PERSONALIZADO */
function addCustom(){

if(!colorSel || !flowerSel){
alert("Elegí color y flor");
return;
}

let wrap=document.getElementById("wrap").value;

carrito.push({
name:flowerSel,
color:colorSel,
wrap:wrap,
price:5000,
qty:1
});

renderCart();
}

/* CARRITO */
function renderCart(){
let div=document.getElementById("cartList");
div.innerHTML="";
let total=0;

carrito.forEach((p,i)=>{
total+=p.price*p.qty;

div.innerHTML+=`
<div class="card">
${p.name} - ${p.color}<br>
${p.wrap}<br>
$${p.price}
<br>
<button onclick="p.qty++;renderCart()">+</button>
${p.qty}
<button onclick="p.qty--;renderCart()">-</button>
<button onclick="carrito.splice(${i},1);renderCart()">X</button>
</div>
`;
});

div.innerHTML+=`<h3>Total: $${total}</h3>`;
count.innerText=carrito.length;
}

/* WHATSAPP */
function send(){
let text="Pedido:\n";

carrito.forEach(p=>{
text+=`${p.name} x${p.qty}\n`;
});

window.open("https://wa.me/5492942338718?text="+encodeURIComponent(text));
}

/* ADMIN */
function addProduct(){
let name=pname.value;
let img=pimg.value;
let price=parseInt(pprice.value);

productos.push({name,img,price});

localStorage.setItem("productos",JSON.stringify(productos));

renderProducts();
renderAdmin();
}

/* RENDER PRODUCTOS */
function renderProducts(){
products.innerHTML="";

productos.forEach(p=>{
products.innerHTML+=`
<div class="card">
<img src="${p.img}" width="100%">
${p.name}<br>
$${p.price}
<br>
<button onclick="addToCart('${p.name}',${p.price})">Agregar</button>
</div>
`;
});
}

function addToCart(n,p){
carrito.push({name:n,price:p,qty:1});
renderCart();
}

/* ADMIN LISTA */
function renderAdmin(){
adminList.innerHTML="";

productos.forEach((p,i)=>{
adminList.innerHTML+=`
<div>
${p.name}
<button onclick="deleteProd(${i})">Eliminar</button>
</div>
`;
});
}

function deleteProd(i){
productos.splice(i,1);
localStorage.setItem("productos",JSON.stringify(productos));
renderProducts();
renderAdmin();
}

/* INIT */
renderProducts();
renderAdmin();

</script>

</body>
</html>
