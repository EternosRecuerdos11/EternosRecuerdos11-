<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eternos Recuerdos</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{font-family:Poppins;margin:0;background:#f5efe6;}
header{background:#0b3c5d;color:white;padding:15px;display:flex;justify-content:space-between;}
button{background:#0b3c5d;color:white;border:none;padding:10px;border-radius:20px;}
.pantalla{display:none;padding:20px;}
.activa{display:block;}
.menu,.productos{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}
.card,.card-menu{background:white;padding:10px;border-radius:20px;text-align:center;}
img{width:100%;border-radius:15px;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#00000080;display:flex;justify-content:center;align-items:center;}
.modal-contenido{background:white;padding:20px;border-radius:20px;width:300px;}
.oculto{display:none;}
input,select{width:100%;padding:8px;margin:5px 0;border-radius:10px;}
</style>
</head>

<body>

<header>
<h3>Eternos Recuerdos</h3>
<div>
<button onclick="ir('carrito')">🛒</button>
<button onclick="abrirAdmin()">⚙️</button>
</div>
</header>

<!-- INICIO -->
<section id="inicio" class="pantalla activa">
<h2>Bienvenida 💐</h2>
<div class="menu">
<div class="card-menu" onclick="ir('productos')">
<img src="https://images.unsplash.com/photo-1525310072745-f49212b5ac6d">
<p>Ver productos</p>
</div>
</div>
</section>

<!-- PRODUCTOS -->
<section id="productos" class="pantalla">
<h2>Productos</h2>
<div class="productos" id="lista"></div>
</section>

<!-- CARRITO -->
<section id="carrito" class="pantalla">
<h2>Carrito</h2>
<div id="items"></div>

<h3>Total: $<span id="total"></span></h3>

<h3>Datos del cliente</h3>
<input id="nombre" placeholder="Nombre">
<input id="telefono" placeholder="Teléfono">
<input id="direccion" placeholder="Dirección">

<button onclick="enviarPedido()">Enviar pedido</button>
</section>

<!-- MODAL PRODUCTO -->
<div id="modal" class="modal oculto">
<div class="modal-contenido">
<span onclick="cerrarModal()">❌</span>
<img id="imgModal">
<h3 id="nombreModal"></h3>
<p>$<span id="precioModal"></span></p>

<input type="number" id="cantidad" value="1">

<select id="color">
<option>Rojo</option>
<option>Rosa</option>
<option>Blanco</option>
</select>

<button onclick="agregarCarrito()">Agregar</button>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="modal oculto">
<div class="modal-contenido">
<h3>Admin 🔒</h3>

<input id="pass" placeholder="Contraseña">
<button onclick="login()">Entrar</button>

<div id="panel" class="oculto">

<h4>Agregar producto</h4>
<input id="nuevoNombre" placeholder="Nombre">
<input id="nuevoPrecio" placeholder="Precio">
<input id="nuevoImg" placeholder="URL imagen">
<button onclick="agregarProducto()">Guardar</button>

<h4>Productos</h4>
<div id="listaAdmin"></div>

</div>

</div>
</div>

<script>

let actual="inicio";
function ir(id){
document.getElementById(actual).classList.remove("activa");
document.getElementById(id).classList.add("activa");
actual=id;
if(id==="carrito") mostrarCarrito();
}

let productos=[
{nombre:"Ramo rojo",precio:15000,img:"https://images.unsplash.com/photo-1519378058457-4c29a0a2efac"}
];

let carrito=[];
let actualProducto=null;

function cargar(){
let cont=document.getElementById("lista");
cont.innerHTML="";
productos.forEach((p,i)=>{
cont.innerHTML+=`
<div class="card" onclick="abrirModal(${i})">
<img src="${p.img}">
<p>${p.nombre}</p>
<p>$${p.precio}</p>
</div>`;
});
cargarAdmin();
}

function abrirModal(i){
actualProducto=productos[i];
imgModal.src=actualProducto.img;
nombreModal.innerText=actualProducto.nombre;
precioModal.innerText=actualProducto.precio;
modal.classList.remove("oculto");
}

function cerrarModal(){modal.classList.add("oculto");}

function agregarCarrito(){
let cant=parseInt(cantidad.value);
carrito.push({...actualProducto,cantidad:cant});
cerrarModal();
alert("Agregado");
}

function mostrarCarrito(){
let cont=document.getElementById("items");
let total=0;
cont.innerHTML="";
carrito.forEach(p=>{
total+=p.precio*p.cantidad;
cont.innerHTML+=`<p>${p.nombre} x${p.cantidad}</p>`;
});
document.getElementById("total").innerText=total;
}

function enviarPedido(){
let texto="Pedido:%0A";
carrito.forEach(p=>{
texto+=`${p.nombre} x${p.cantidad}%0A`;
});

texto+=`Nombre:${nombre.value}%0A`;
texto+=`Tel:${telefono.value}%0A`;
texto+=`Dir:${direccion.value}`;

window.open("https://wa.me/?text="+texto);
}

/* ADMIN */
function abrirAdmin(){admin.classList.remove("oculto");}

function login(){
if(pass.value==="1234"){
panel.classList.remove("oculto");
}
}

function agregarProducto(){
productos.push({
nombre:nuevoNombre.value,
precio:parseInt(nuevoPrecio.value),
img:nuevoImg.value
});
cargar();
}

function cargarAdmin(){
let cont=document.getElementById("listaAdmin");
cont.innerHTML="";
productos.forEach((p,i)=>{
cont.innerHTML+=`<p>${p.nombre} $${p.precio}</p>`;
});
}

cargar();

</script>

</body>
</html>
